{{- /*
  Optional in-cluster databases for exercising Infrastructure → Databases onboarding.
  Enable per-engine in values; endpoints are standard K8s DNS (not referenced from Owlpane SaaS).
*/ -}}
{{- $ns := .Values.namespace -}}
{{- if .Values.databases.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.databases.postgres.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "owlpane-demo.labels" . | nindent 4 }}
    owlpane.io/demo-database: postgresql
type: Opaque
stringData:
  username: {{ .Values.databases.postgres.username | quote }}
  password: {{ .Values.databases.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.databases.postgres.serviceName }}
  namespace: {{ $ns }}
  labels:
    {{- include "owlpane-demo.labels" . | nindent 4 }}
    owlpane.io/demo-database: postgresql
    owlpane.io/demo-database-port: {{ .Values.databases.postgres.port | quote }}
spec:
  selector:
    app: {{ .Values.databases.postgres.serviceName }}
    {{- include "owlpane-demo.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.databases.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.databases.postgres.serviceName }}
  namespace: {{ $ns }}
  labels:
    app: {{ .Values.databases.postgres.serviceName }}
    {{- include "owlpane-demo.labels" . | nindent 4 }}
    owlpane.io/demo-database: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.databases.postgres.serviceName }}
      {{- include "owlpane-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ .Values.databases.postgres.serviceName }}
        {{- include "owlpane-demo.selectorLabels" . | nindent 8 }}
        owlpane.io/demo-database: postgresql
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.databases.postgres.image.repository }}:{{ .Values.databases.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.databases.postgres.image.pullPolicy }}
          ports: [{ name: postgres, containerPort: {{ .Values.databases.postgres.port }} }]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.databases.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.databases.postgres.secretName }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.databases.postgres.secretName }}, key: password } }
          resources:
            {{- toYaml .Values.databases.resources | nindent 12 }}
{{- end }}
