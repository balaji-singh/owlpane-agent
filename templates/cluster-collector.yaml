{{- if .Values.clusterCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owlpane-cluster-collector
  namespace: {{ .Release.Namespace }}
  labels: {{- include "owlpane.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: owlpane-agent, app.kubernetes.io/component: cluster }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owlpane-agent
        app.kubernetes.io/component: cluster
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/cluster-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "owlpane.sa" . }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/conf/config.yaml"]
          env: {{- include "owlpane.env" . | nindent 12 }}
          readinessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 20, initialDelaySeconds: 15 }
          resources: {{- toYaml .Values.clusterCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: conf, mountPath: /conf, readOnly: true }
      volumes:
        - name: conf
          configMap: { name: owlpane-cluster-collector }
{{- end }}
