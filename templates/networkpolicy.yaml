{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: owlpane-agent-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: owlpane-agent }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 443, protocol: TCP }, { port: 4318, protocol: TCP }, { port: 10250, protocol: TCP }, { port: 6443, protocol: TCP }, { port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
{{- end }}
